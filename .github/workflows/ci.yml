name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    name: Run Unit Tests & Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify Code Style (Flake8 & Black)
        run: |
          flake8 src tests scripts --max-line-length=120 --extend-ignore=E203,W503
          black --check --line-length=120 src tests scripts

      - name: Validate CloudFormation / SAM Template
        run: |
          cfn-lint template.yaml

      - name: Execute Pytest Suite with Coverage
        run: |
          pytest -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload Coverage to Summary
        if: always()
        run: |
          echo "### Test Execution Completed Successfully :rocket:" >> $GITHUB_STEP_SUMMARY
